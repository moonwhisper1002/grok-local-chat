# Personalized and optimized for Mihomo / Clash Verge Rev
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 360
profile:
  store-selected: true
  store-fake-ip: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
dns:
  enable: true
  listen: 127.0.0.1:7874
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    domain:
      - '+.google.com'
      - '+.googleapis.com'
      - '+.googleusercontent.com'
      - '+.gvt1.com'
      - '+.gvt2.com'
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
      - 127.0.0.0/8
  nameserver-policy:
    'geosite:cn,apple,private':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "time.*.apple.com"
    - "ntp.*.com"
    - "*.time.edu.cn"
    - "*.ntp.org.cn"
    - "+.pool.ntp.org"
    - "+.definition-meaning.top"
    - "+.sfr-bouygues.cloud"
    - "+.portail-offres.top"
    - "+.bilivideo.com"
    - "+.douyinvod.com"
    - "captive.apple.com"
    - "connect.rom.miui.com"
    - "www.msftconnecttest.com"
    - "dns.msftncsi.com"
    - "wifi.vivo.com.cn"
    - "connectivitycheck.platform.hicloud.com"
    - "+.feishu.cn"
    - "+.dingtalk.com"
    - "+.chat.bilibili.com"
    - "stun.*.*"
    - "stun.*.*.*"
