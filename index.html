<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><link rel="manifest" href="manifest.webmanifest"><title>Grok 小站</title><style>
:root{--bg:#101820;--side:#151e27;--card:#1d2935;--text:#eef5f4;--muted:#95a5ad;--line:#34434f;--lime:#dafa75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px "Microsoft YaHei",Arial,sans-serif}.app{min-height:100vh;display:flex}.side{width:270px;background:var(--side);padding:18px 12px;display:flex;flex-direction:column;border-right:1px solid var(--line)}.brand{font-size:18px;font-weight:bold;padding:5px 8px 18px}.mark{display:inline-grid;place-items:center;background:var(--lime);color:#152019;width:29px;height:29px;border-radius:9px;margin-right:9px;font-family:Georgia}.new,.history button{width:100%;border:1px solid var(--line);color:var(--text);background:transparent;border-radius:9px;padding:11px;text-align:left}.history{flex:1;margin-top:13px;overflow:auto}.history button{border:0;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button.active,.history button:hover{background:#263441}.side small{color:var(--muted);padding:12px 8px 0}.pane{max-width:920px;min-height:100vh;display:flex;flex:1;flex-direction:column;margin:auto}.top{height:64px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.top div{flex:1}.top small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.icon{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:8px;padding:7px 10px}.msgs{flex:1;overflow:auto;padding:35px max(20px,calc((100vw - 940px)/2))}.empty{text-align:center;margin-top:16vh}.empty .mark{width:48px;height:48px;font-size:25px;margin:0}.empty p{color:var(--muted)}.message{max-width:780px;margin:0 auto 24px;display:grid;grid-template-columns:32px 1fr;gap:12px;line-height:1.7}.avatar{width:30px;height:30px;border-radius:9px;background:#324250;display:grid;place-items:center;font-weight:bold}.assistant .avatar{background:var(--lime);color:#152019;font-family:Georgia}.content{white-space:pre-wrap}.content pre{white-space:pre-wrap;background:#0c1218;border:1px solid var(--line);padding:12px;border-radius:8px;overflow:auto}.sources a{display:inline-block;color:var(--lime);border:1px solid var(--line);padding:4px 8px;border-radius:6px;margin:8px 5px 0 0;text-decoration:none;font-size:12px}.compose{width:min(780px,calc(100% - 28px));margin:auto;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px}.tog button{border:0;background:transparent;color:var(--muted);padding:5px 8px}.tog button.on{background:#30413c;color:var(--lime);border-radius:6px}textarea{width:100%;resize:none;background:transparent;border:0;outline:0;color:var(--text);padding:8px;min-height:42px}.bottom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.send{border:0;border-radius:8px;background:var(--lime);font-size:20px;width:31px;height:30px}.privacy{text-align:center;color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center}.box{background:var(--card);width:min(450px,92vw);padding:22px;border:1px solid var(--line);border-radius:14px}.box h2{margin-top:0}.box label{display:block;margin:15px 0;font-weight:bold;font-size:13px}.box input,.box select{width:100%;padding:10px;background:#111b24;color:var(--text);border:1px solid var(--line);border-radius:7px;margin-top:6px}.done{float:right;background:var(--lime);border:0;border-radius:7px;padding:9px 17px}.hide{display:none}@media(max-width:700px){.side{position:fixed;z-index:2;height:100vh;transform:translateX(-105%);transition:.2s}.side.show{transform:translateX(0)}.msgs{padding:25px 15px}.menu{display:block!important}.empty{margin-top:9vh}}@media(min-width:701px){.menu{display:none}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><span class="mark">G</span>Grok 小站</div><button class="new" id="new">＋ 新对话</button><div class="history" id="history"></div><button class="icon" id="set2">⚙ 设置与 API Key</button><small>数据只保存在本机</small></aside><main class="pane"><header class="top"><button class="icon menu" id="menu">☰</button><div><b id="title">Grok 小站</b><small id="modelLabel">grok-4.5</small></div><button class="icon" id="set">⚙</button></header><section class="msgs" id="msgs"></section><form class="compose" id="form"><div class="tog"><button type="button" id="web">◉ Web 搜索</button><button type="button" id="x">𝕏 X 搜索</button></div><textarea id="input" placeholder="发送消息给 Grok…"></textarea><div class="bottom"><span>Enter 发送 · Shift + Enter 换行</span><button class="send" id="send">↑</button></div></form><p class="privacy">API Key 和聊天记录仅保存在这台设备；Key 只会传给 xAI。</p></main></div><section class="modal hide" id="modal"><div class="box"><h2>设置</h2><label>显示模式<select id="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>xAI API Key<input id="key" type="password" placeholder="xai-…"></label><label>模型<select id="model"><option value="grok-4.5">Grok 4.5</option><option value="grok-4.1-fast">Grok 4.1 Fast</option><option value="grok-4.1">Grok 4.1</option><option value="grok-3">Grok 3</option></select></label><button class="done" id="save">完成</button></div></section><script>
const D={apiKey:"",model:"grok-4.5",web:true,x:false,theme:"system"};let S={...D},C=[],A="",aborter=null;const q=x=>document.querySelector(x),uid=()=>Date.now()+"-"+Math.random().toString(36).slice(2,7),fresh=()=>({id:uid(),title:"新对话",messages:[]});function chat(){return C.find(x=>x.id===A)||C[0]}function persist(){localStorage.setItem("glc",JSON.stringify(C));localStorage.setItem("gls",JSON.stringify(S))}function theme(){let t=S.theme==="system"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):S.theme;document.documentElement.dataset.theme=t;if(t==="light"){document.documentElement.style.setProperty("--bg","#f6f8f4");document.documentElement.style.setProperty("--side","#fff");document.documentElement.style.setProperty("--card","#fff");document.documentElement.style.setProperty("--text","#162018");document.documentElement.style.setProperty("--muted","#657268");document.documentElement.style.setProperty("--line","#d6ded8");document.documentElement.style.setProperty("--lime","#718600")}else{for(let k of ["--bg","--side","--card","--text","--muted","--line","--lime"])document.documentElement.style.removeProperty(k)}}function esc(s){return s.replace(/[&<>]/g,x=>x==="&"?"&amp;":x==="<"?"&lt;":"&gt;")}function draw(){let c=chat();q("#title").textContent=c.title;q("#modelLabel").textContent=S.model;q("#web").classList.toggle("on",S.web);q("#x").classList.toggle("on",S.x);q("#history").innerHTML="";C.forEach(x=>{let b=document.createElement("button");b.textContent=x.title;b.className=x.id===A?"active":"";b.onclick=()=>{A=x.id;draw()};q("#history").append(b)});q("#msgs").innerHTML="";if(!c.messages.length){q("#msgs").innerHTML='<div class="empty"><span class="mark">G</span><h1>今天想问 Grok 什么？</h1><p>选择模型、按需开启 Web 或 X 搜索，然后直接开始聊。</p></div>';return}c.messages.forEach(m=>{let a=document.createElement("article");a.className="message "+m.role;let av=document.createElement("span");av.className="avatar";av.textContent=m.role==="user"?"你":"G";let d=document.createElement("div");d.className="content";d.textContent=m.content||"正在思考…";a.append(av,d);q("#msgs").append(a)});q("#msgs").scrollTop=q("#msgs").scrollHeight}function settings(){q("#key").value=S.apiKey;q("#model").value=S.model;q("#theme").value=S.theme;q("#modal").classList.remove("hide")}function update(fn){C=C.map(x=>x.id===A?fn(x):x);persist();draw()}async function send(){let text=q("#input").value.trim(),c=chat();if(!text||aborter)return;if(!S.apiKey){settings();return}q("#input").value="";let u={id:uid(),role:"user",content:text},aid=uid(),g={id:aid,role:"assistant",content:""};let input=c.messages.concat(u).map(x=>({role:x.role,content:x.content}));update(x=>({id:x.id,title:x.messages.length?x.title:text.slice(0,28),messages:x.messages.concat(u,g)}));aborter=new AbortController();try{let tools=[];if(S.web)tools.push({type:"web_search"});if(S.x)tools.push({type:"x_search"});let r=await fetch("https://api.x.ai/v1/responses",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.apiKey},signal:aborter.signal,body:JSON.stringify({model:S.model,input,tools,stream:true})});if(!r.ok)throw Error(await r.text());let rd=r.body.getReader(),de=new TextDecoder(),buf="";while(1){let z=await rd.read();if(z.done)break;buf+=de.decode(z.value,{stream:true});let ev=buf.split("\n\n");buf=ev.pop();ev.forEach(raw=>{let data=raw.split("\n").filter(x=>x.startsWith("data:")).map(x=>x.slice(5).trim()).join("");try{let p=JSON.parse(data);if(p.type==="response.output_text.delta")update(x=>({id:x.id,title:x.title,messages:x.messages.map(m=>m.id===aid?{id:m.id,role:m.role,content:m.content+p.delta}:m)}))}catch(e){}})}}catch(e){update(x=>({id:x.id,title:x.title,messages:x.messages.map(m=>m.id===aid&& !m.content?{id:m.id,role:m.role,content:"无法连接 xAI："+e.message}:m)}))}finally{aborter=null}}try{C=JSON.parse(localStorage.getItem("glc")||"[]");S={...D,...JSON.parse(localStorage.getItem("gls")||"{}")}}catch(e){}if(!C.length)C=[fresh()];A=C[0].id;theme();draw();q("#new").onclick=()=>{C.unshift(fresh());A=C[0].id;persist();draw()};q("#menu").onclick=()=>q("#side").classList.add("show");q("#set").onclick=settings;q("#set2").onclick=settings;q("#web").onclick=()=>{S.web=!S.web;persist();draw()};q("#x").onclick=()=>{S.x=!S.x;persist();draw()};q("#form").onsubmit=e=>{e.preventDefault();send()};q("#input").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};q("#save").onclick=()=>{S.apiKey=q("#key").value;S.model=q("#model").value;S.theme=q("#theme").value;persist();theme();q("#modal").classList.add("hide");draw()};if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
